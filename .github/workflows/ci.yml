name: Verify Himaya

on:
  push:
    branches: [main, arena/01a05ec2-anti-theft-of-phones]
  pull_request:

permissions:
  contents: read

jobs:
  web-and-static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:pwa
      - run: npm run check:edge
      - run: npm test
      - run: npm run build
      - run: npm run secrets:check
